    /* -------------------------------------------------
       CSS Variables (Theming)
    ------------------------------------------------- */
    :root {
      --bg-color: #0f0f10;
      --text-color: #ffffff;
      --secondary-bg: #161616;
      --accent-color: #c62828; /* Slightly stronger red for contrast */
      --accent-text: #ffffff;
      --card-bg: #1e1e1e;
      --icon-filter: invert(80%);
      --border-color: #2c2c2c;
      --btn-border: 1px solid rgba(255, 255, 255, 0.18);
    }
    [data-theme="light"] {
      --bg-color: #fcfcfc;
      --text-color: #111;
      --secondary-bg: #f4f4f4;
      --accent-color: #8b0d19; /* Keep vivid red for light mode */
      --accent-text: #ffffff;
      --card-bg: #fff;
      --icon-filter: invert(20%);
      --border-color: #ccc;
      --btn-border: 1px solid rgba(0, 0, 0, 0.1);
    }

    /* -------------------------------------------------
       Global Reset & Typography
    ------------------------------------------------- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; scroll-behavior: smooth; }
    body {
      font-family: 'Amiri', serif;
      background: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      transition: background 0.3s, color 0.3s;
    }
    body[lang="en"] {
      font-family: 'Playfair Display', serif;
    }

    /* -------------------------------------------------
       Helper Classes
    ------------------------------------------------- */
    .btn {
      display: inline-block;
      padding: .75rem 1.5rem;
      border-radius: .4rem;
      text-decoration: none;
      font-weight: 600;
      transition: transform .2s, background .2s, color .2s, border-color .2s;
      cursor: pointer;
      border: var(--btn-border);
    }
    a:focus, button:focus { outline: 3px dashed #ffd2d2; outline-offset: 3px; }
    .btn:hover { transform: translateY(-2px); }
    .primary { background: var(--accent-color); color: var(--accent-text); box-shadow: 0 4px 15px rgba(139, 13, 25, 0.2); }
    .secondary { background: transparent; border: 2px solid var(--accent-color); color: var(--accent-color); }
    .map-btn { margin-top: .5rem; }

    /* -------------------------------------------------
       Header
    ------------------------------------------------- */
    .site-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 1rem 2rem;
    }
    .controls {
      display: flex; gap: 1rem;
    }
    .lang-toggle, .theme-toggle {
      background: none; border: 2px solid var(--accent-color);
      color: var(--accent-color); cursor: pointer;
      padding: .5rem .8rem; border-radius: .4rem;
      font-family: inherit; font-weight: bold;
      transition: all 0.3s;
    }
    .lang-toggle:hover, .theme-toggle:hover {
      background: var(--accent-color); color: var(--accent-text);
    }

    /* -------------------------------------------------
       Hero
    ------------------------------------------------- */
    .hero {
      position: relative; min-height: 80vh;
      background: url('assets/images/gallery/hero-bg.png') center/cover no-repeat;
      display: flex; align-items: center; justify-content: center; text-align: center;
    }
    .hero::before { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.6); }
    .hero-content { position: relative; max-width: 700px; color: #fff; padding: 0 1rem; }
    .hero h1 { font-size: 2.5rem; margin-bottom: .5rem; }
    .hero p { font-size: 1.2rem; margin-bottom: 1.5rem; }
    .hero-cta .btn { margin: .3rem; }

    /* -------------------------------------------------
       Gallery
    ------------------------------------------------- */
    .gallery { padding: 4rem 1rem; background: var(--bg-color); text-align: center; }
    .gallery h2 { margin-bottom: 2rem; font-size: 2rem; color: var(--accent-color); }
    .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); max-width: 1200px; margin: 0 auto; }
    .gallery-item { overflow: hidden; border-radius: .5rem; position: relative; cursor: pointer; }
    .gallery-item img { width: 100%; height: 100%; object-fit: cover; aspect-ratio: 1; transition: transform .4s, filter .4s; }
    .gallery-item:hover img { transform: scale(1.08); filter: brightness(1.2); }

    /* -------------------------------------------------
       Reviews
    ------------------------------------------------- */
    .reviews { padding: 4rem 1rem; background: var(--secondary-bg); text-align: center; }
    .reviews h2 { margin-bottom: 2rem; color: var(--accent-color); font-size: 2rem; }
    .cards { display: flex; flex-wrap: wrap; gap: 1.5rem; justify-content: center; }
    .review-card {
      background: var(--card-bg); border-radius: .5rem; padding: 1.5rem; max-width: 300px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: 1px solid var(--border-color);
    }
    .review-text { margin-bottom: .8rem; color: var(--text-color); font-size: 1.1rem; font-style: italic; }
    .review-author { font-weight: bold; color: var(--accent-color); margin-bottom: .5rem; }

    /* -------------------------------------------------
       Map Section
    ------------------------------------------------- */

    .map-section h2 { margin-bottom: 2rem; color: var(--accent-color); font-size: 2rem; }
    .map-container { width: 100%; max-width: 1000px; margin: 0 auto 1.5rem auto; height: 350px; overflow: hidden; border-radius: .5rem; border: 1px solid var(--border-color); }
    .map-container iframe { width: 100%; height: 100%; border: none; }

    /* -------------------------------------------------
       Contact & Form
    ------------------------------------------------- */
    .contact { padding: 4rem 1rem; background: var(--secondary-bg); text-align: center; }
    .contact h2 { margin-bottom: 1.5rem; color: var(--accent-color); font-size: 2rem; }
    .phone .btn { background: var(--accent-color); color: var(--accent-text); font-size: 1.2rem; }
    
    .form-container { max-width: 600px; margin: 2rem auto; }
    .contact-form { text-align: left; }
    body[dir="rtl"] .contact-form { text-align: right; }
    body[dir="rtl"] .contact-form input,

    .contact-form .form-group { margin-bottom: 1rem; }
    .contact-form input, .contact-form textarea {

      background: var(--bg-color); color: var(--text-color);

    .contact-form input:focus, .contact-form textarea:focus {
      outline: none; border-color: var(--accent-color);

    .social { margin-top: 1.5rem; display: flex; justify-content: center; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .social-btn { display: inline-flex; transition: transform 0.2s; }
    .social-btn:hover { transform: scale(1.1); }
    .social-btn img { width: 36px; height: 36px; filter: var(--icon-filter); transition: filter 0.3s; }

    /* -------------------------------------------------

    .site-footer { background: var(--bg-color); color: var(--text-color); text-align: center; padding: 1.5rem 0; font-size: .9rem; border-top: 1px solid var(--border-color); }

    }
  </style>
</head>

  <script>
    // --- TRANSLATIONS ---
    const translations = {
      ar: {
        heroTitle: "تألّق الفضة الفاخرة",
        heroTagline: "المجوهرات التي تحكي قصة من الفخامة والعبقرية",
        ctaWhatsApp: "راسلنا على واتساب",
        galleryTitle: "معرض منتجاتنا",
        reviewsTitle: "ماذا يقول عملاؤنا",
        mapTitle: "موقعنا",
        directionsBtn: "احصل على الاتجاهات",
        contactTitle: "اتصل بنا"
      },
      en: {
        heroTitle: "Luxury Silver Elegance",
        heroTagline: "Jewelry that tells a story of opulence and craftsmanship",
        ctaWhatsApp: "Message on WhatsApp",
        galleryTitle: "Our Gallery",
        reviewsTitle: "What Our Clients Say",
        mapTitle: "Our Location",
        directionsBtn: "Get Directions",
        contactTitle: "Contact"
      }
    };

    let currentLang = "ar";
    const translationNodes = Array.from(document.querySelectorAll('[data-key]'));
    function applyTranslations() {
      translationNodes.forEach(el => {
        const key = el.dataset.key;
        if (translations[currentLang] && translations[currentLang][key]) {
          el.textContent = translations[currentLang][key];
        }
      });
    }

    function setDirection(lang) {
      const html = document.documentElement;
      const body = document.body;
      if (lang === "ar") {
        html.setAttribute("lang", "ar");
        html.setAttribute("dir", "rtl");
        body.setAttribute("lang", "ar");
      } else {
        html.setAttribute("lang", "en");
        html.setAttribute("dir", "ltr");
        body.setAttribute("lang", "en");
      }
    }

    const langToggleEl = document.getElementById('lang-toggle');
    if (langToggleEl) {
      langToggleEl.addEventListener('click', () => {
        currentLang = currentLang === 'ar' ? 'en' : 'ar';
        setDirection(currentLang);
        applyTranslations();
      });
    }

    // --- THEME TOGGLE ---
    const themeToggleBtn = document.getElementById('theme-toggle');
    const htmlEl = document.documentElement;
    if (themeToggleBtn) {
      themeToggleBtn.addEventListener('click', () => {
        const currentTheme = htmlEl.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        htmlEl.setAttribute('data-theme', newTheme);
      });
    }

    // --- LIGHTBOX ---
    function createLightbox() {
      const lb = document.createElement("div");
      lb.id = "lightbox";
      lb.style.cssText = `
        position:fixed; inset:0; background:rgba(0,0,0,.9);
        display:none; align-items:center; justify-content:center; z-index:10000;
        padding: 2rem; cursor: pointer;`;
      const img = document.createElement("img");
      img.style.maxWidth = "100%";
      img.style.maxHeight = "100%";
      img.style.objectFit = "contain";
      img.style.borderRadius = "8px";
      lb.appendChild(img);
      document.body.appendChild(lb);
      lb.addEventListener("click", () => (lb.style.display = "none"));
      return {
        show(src) {
          img.src = src;
          lb.style.display = "flex";
        }
      };
    }
    // Lazy-init lightbox to reduce startup cost
    let lightbox;
    function initLightboxIfNeeded() {
      if (lightbox) return;
      lightbox = createLightbox();
      document.querySelectorAll('.gallery-item img').forEach(img => {
        img.addEventListener('click', () => lightbox.show(img.dataset.src || img.src));
      });
    }
    // Observe when gallery intersects viewport, then init
    if ('IntersectionObserver' in window) {
      const galleryObserver = new IntersectionObserver((entries, obs) => {
        entries.forEach(e => {
          if (e.isIntersecting) {
            initLightboxIfNeeded();
            obs.disconnect();
          }
        });
      });
      const galleryEl = document.querySelector('.gallery');
      if (galleryEl) galleryObserver.observe(galleryEl);
    } else {
      // Fallback
      initLightboxIfNeeded();
    }

    // --- LAZY-SWAP WEBP FOR IMAGES ---
    function lazySwapWebP() {
      if (!('IntersectionObserver' in window)) return;
      const imgs = document.querySelectorAll('img[data-webp]');
      const imgObserver = new IntersectionObserver((entries, obs) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const img = entry.target;
            const webp = img.getAttribute('data-webp');
            if (webp) {
              const test = new Image();
              test.src = webp;
              test.onload = () => {
                const parent = img.parentNode;
                const source = parent && parent.querySelector('source[type="image/webp"]');
                if (source) source.srcset = webp;
                img.src = webp;
              };
            }
            obs.unobserve(img);
          }
        });
      }, {rootMargin: '200px'});
      imgs.forEach(i => imgObserver.observe(i));
    }

    // --- INIT (defer non-critical work to idle) ---
    setDirection(currentLang);
    applyTranslations();
    const idle = window.requestIdleCallback || function(fn){ return setTimeout(fn, 200); };
    idle(() => {
      try { initLightboxIfNeeded(); } catch(e) { /* safe fallback */ }
      try { lazySwapWebP(); } catch(e) { /* safe fallback */ }
    });
  </script>
  </main>
</body>
</html>
